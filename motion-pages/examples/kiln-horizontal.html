<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KILN — from clay to table, in five chapters</title>
<meta name="description" content="Horizontal scroll-snap storyteller: the wheel drives a sideways rail of chapters with per-layer parallax and soft snapping — pure DOM, no libraries."/>
<style>
:root{
  --e:cubic-bezier(.22,1,.36,1);--in:cubic-bezier(.16,1,.3,1);
  --serif:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --ink:#1b1512;--bone:#f2ebe0;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:auto}
body{background:var(--ink);color:var(--bone);font:400 16px/1.5 var(--serif);overflow-x:hidden}
#track{height:500vh}                                   /* 5 chapters → 5 viewports of vertical scroll */
#view{position:fixed;inset:0;overflow:hidden}
#rail{position:absolute;top:0;left:0;height:100%;display:flex;will-change:transform}
.ch{position:relative;flex:0 0 100vw;height:100%;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;align-items:end;
 padding:0 6vw 12vh;background:var(--bg);transition:none}
.ch::after{content:"";position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(70% 60% at 30% 20%,rgba(255,255,255,.08),transparent 70%),linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.25))}
/* parallax layers: each moves at its own rate from --p (this chapter's local progress) */
.layer{position:absolute;inset:0;pointer-events:none;will-change:transform}
.num{position:absolute;top:8vh;left:5vw;font:300 clamp(160px,34vw,520px)/1 var(--serif);letter-spacing:-.06em;
 color:rgba(255,255,255,.06);transform:translateX(calc(var(--p) * -18vw))}
.art{position:absolute;right:6vw;bottom:14vh;width:min(38vw,520px);aspect-ratio:1;
 transform:translateX(calc(var(--p) * -9vw)) rotate(calc(var(--p) * -6deg))}
.art canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 40px 60px rgba(0,0,0,.45))}
.copy{position:relative;z-index:2;transform:translateX(calc(var(--p) * 6vw))}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;opacity:.7;margin-bottom:22px}
.ch h2{font:300 clamp(40px,6vw,96px)/.98 var(--serif);letter-spacing:-.035em;text-wrap:balance}
.ch h2 em{font-style:italic;color:var(--acc)}
.ch p{margin-top:22px;max-width:40ch;font-size:clamp(15px,1.15vw,18px);line-height:1.55;opacity:.85}
/* chrome */
#ui{position:fixed;inset:0;z-index:5;pointer-events:none}
#ui a,#ui button{pointer-events:auto}
nav{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:24px 40px}
.brand{display:inline-block;padding:8px 0;font:600 17px/1 var(--serif);letter-spacing:.34em;color:var(--bone);text-decoration:none;transition:letter-spacing .5s var(--e),opacity .5s var(--e)}
.brand:hover,.brand:focus-visible{letter-spacing:.42em;outline:none}
.brand i{color:#e0894a;font-style:normal}
.gh{padding:11px 18px;border-radius:999px;background:var(--bone);color:var(--ink);font:600 12px/1 var(--mono);text-decoration:none;
 transition:transform .45s var(--e),background .45s var(--e)}
.gh:hover,.gh:focus-visible{transform:translateY(-2px);background:#fff;outline:none}
#bar{position:absolute;left:0;top:0;height:2px;width:100%;background:rgba(255,255,255,.12)}
#bar i{display:block;height:100%;width:100%;background:var(--bone);transform-origin:0 50%;transform:scaleX(var(--p,0))}
.dots{position:absolute;right:40px;top:50%;translate:0 -50%;display:flex;flex-direction:column;gap:14px}
.dots button{width:32px;height:32px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;border-radius:50%;transition:transform .4s var(--e)}
.dots button:hover{transform:scale(1.15)}
.dots button::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--bone);opacity:.35;transition:transform .5s var(--e),opacity .5s var(--e)}
.dots button.on::before{opacity:1;transform:scale(1.7)}
.dots button:hover::before,.dots button:focus-visible::before{opacity:.9}
.dots button:focus-visible{outline:1px solid rgba(255,255,255,.5)}
.foot{position:absolute;left:40px;right:40px;bottom:24px;display:flex;justify-content:space-between;align-items:center;
 font:500 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.hint{padding:11px 16px;border-radius:999px;background:rgba(27,21,18,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .6s var(--e)}
.idx{font-variant-numeric:tabular-nums}
@media (max-width:720px){
  nav{padding:18px 20px}.foot{left:20px;right:20px;bottom:18px}.dots{right:14px;gap:8px}
  .ch{grid-template-columns:1fr;padding:0 20px 14vh;align-items:end}
  .art{right:-6vw;bottom:34vh;width:62vw}.num{top:6vh;left:2vw}
  .ch p{max-width:none}
}
@media (prefers-reduced-motion: reduce){#rail,.layer,.copy{transition:none}}
</style>
</head>
<body>
<div id="track" aria-hidden="true"></div>
<div id="view"><div id="rail"></div></div>
<div id="ui">
  <div id="bar"><i></i></div>
  <nav>
    <a class="brand" href="#top" aria-label="KILN home">KILN<i>.</i></a>
    <a class="gh" href="https://github.com/jiangyurong609/motion-pages">★ Get this skill</a>
  </nav>
  <div class="dots" id="dots" role="tablist" aria-label="Chapters"></div>
  <div class="foot">
    <div class="hint" id="hint">Scroll — the story runs sideways</div>
    <div class="idx"><span id="cur">01</span> / 05</div>
  </div>
</div>

<script>
const qs=new URLSearchParams(location.search);
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
const STILL=qs.has("still");
const FORCE=qs.has("p")?Math.min(1,Math.max(0,parseFloat(qs.get("p"))||0)):(STILL?0.31:null);

// ---------- chapters (fictional studio; copy is ours)
const CH=[
 {bg:"#5b3a2a",acc:"#e0894a",eye:"Chapter one · Clay",h:"Dug from the <em>river bend</em>",p:"Grey-red earth, wedged by hand until the air is gone. Every piece starts as a fistful of somewhere."},
 {bg:"#3b3430",acc:"#d9b48a",eye:"Chapter two · Wheel",h:"Centered at <em>240 turns</em>",p:"The wheel does the remembering. Thumbs open the well, fingers pull the wall; the form is decided in ninety seconds."},
 {bg:"#233a3c",acc:"#9fd0c8",eye:"Chapter three · Glaze",h:"Ash, feldspar, <em>and patience</em>",p:"Dipped once, wiped at the foot. The colour you see now is not the colour it will be."},
 {bg:"#7a2d1c",acc:"#ffb27a",eye:"Chapter four · Kiln",h:"Twelve hundred <em>eighty degrees</em>",p:"Thirty hours of climb, hold and cool. The kiln decides the last ten percent, and it never tells you in advance."},
 {bg:"#e8dfd0",acc:"#b34a24",eye:"Chapter five · Table",h:"Made to be <em>used daily</em>",p:"Chips are allowed. So are rings of coffee. A bowl that stays on the shelf was never finished.",dark:true},
];
const N=CH.length;
const rail=document.getElementById("rail"),dots=document.getElementById("dots");

// seeded vessel silhouettes painted on canvas — zero image requests
let seed=7;const rand=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
function vessel(i,acc,bg){
  const S=520,c=document.createElement("canvas");c.width=S;c.height=S;const x=c.getContext("2d");
  // ground disc
  x.fillStyle="rgba(0,0,0,.18)";x.beginPath();x.ellipse(S*.5,S*.86,S*.34,S*.06,0,0,7);x.fill();
  // vessel profile: a smooth radius function r(t), t=0 rim → 1 foot, lathed with 48 samples.
  // One silhouette per chapter — lump, open bowl, bottle, jar, cup — so the story reads at a glance.
  const top=S*.18,h=S*.66,J=rand()*.03;
  const R=[
    t=>.30+.10*Math.sin(t*Math.PI)-.06*t+J*Math.sin(t*9),            // clay lump: soft, slightly lopsided
    t=>.10+.30*Math.pow(Math.sin(t*Math.PI*.55),.7)-.22*Math.pow(t,3), // bowl: flares wide, tight foot
    t=>.07+.03*t+.28*Math.pow(Math.sin(Math.max(0,t-.28)*Math.PI/.72*.95),1.4), // bottle: narrow neck, full belly
    t=>.17+.16*Math.sin(t*Math.PI)-.04*t,                              // jar: round shoulders
    t=>.22-.02*t+.03*Math.sin(t*Math.PI),                              // cup: straight, honest
  ][i%5];
  const prof=[];for(let j=0;j<=48;j++){const t=j/48;prof.push([S*R(t),top+h*t]);}
  const outline=()=>{x.beginPath();x.moveTo(S*.5-prof[0][0],prof[0][1]);
    for(const [r,y] of prof)x.lineTo(S*.5-r,y);
    for(let j=prof.length-1;j>=0;j--)x.lineTo(S*.5+prof[j][0],prof[j][1]);x.closePath();};
  x.fillStyle=acc;outline();x.fill();
  // rim + glaze highlight (light from the left)
  x.fillStyle="rgba(255,255,255,.28)";x.beginPath();x.ellipse(S*.5,top,prof[0][0],S*.022,0,0,7);x.fill();
  const g=x.createLinearGradient(S*.2,0,S*.8,0);g.addColorStop(0,"rgba(255,255,255,.26)");g.addColorStop(.45,"rgba(255,255,255,0)");g.addColorStop(1,"rgba(0,0,0,.26)");
  x.fillStyle=g;outline();x.fill();
  // chapter-specific mark
  x.strokeStyle="rgba(255,255,255,.35)";x.lineWidth=3;
  if(i===1){for(let r=1;r<5;r++){const t=r*.17,rr=S*R(t);x.beginPath();x.ellipse(S*.5,top+h*t,rr*.98,S*.011,0,0,7);x.stroke();}} // throwing lines
  if(i===3){x.strokeStyle=acc;x.globalAlpha=.6;for(let r=0;r<3;r++){x.beginPath();x.arc(S*.5,S*.5,S*(.42+r*.05),Math.PI*1.15,Math.PI*1.85);x.stroke();}x.globalAlpha=1;} // kiln heat arcs
  if(i===4){x.strokeStyle=acc;x.lineWidth=S*.05;x.lineCap="round";x.beginPath();x.arc(S*.5+S*R(.5)+S*.05,top+h*.45,S*.09,-Math.PI*.5,Math.PI*.5);x.stroke();} // cup handle
  return c;
}

CH.forEach((c,i)=>{
  const s=document.createElement("section");s.className="ch";
  s.style.setProperty("--bg",c.bg);s.style.setProperty("--acc",c.acc);
  if(c.dark){s.style.color="#1b1512";}
  s.innerHTML=`<div class="layer num">0${i+1}</div>
    <div class="layer"><div class="art"></div></div>
    <div class="copy"><div class="eyebrow">${c.eye}</div><h2>${c.h}</h2><p>${c.p}</p></div>`;
  s.querySelector(".art").appendChild(vessel(i,c.acc,c.bg));
  if(c.dark)s.querySelector(".num").style.color="rgba(0,0,0,.06)";
  rail.appendChild(s);
  const b=document.createElement("button");b.setAttribute("role","tab");b.setAttribute("aria-label",`Chapter ${i+1}`);
  b.addEventListener("click",()=>goTo(i));dots.appendChild(b);
});
const secs=[...rail.children],dotBtns=[...dots.children];
const bar=document.querySelector("#bar i"),cur=document.getElementById("cur"),hint=document.getElementById("hint");

// ---------- progress: vertical scroll → horizontal rail, smoothed; ?p= pins it
const maxY=()=>document.documentElement.scrollHeight-innerHeight;
let target=FORCE??0,p=FORCE??0,lastScroll=performance.now(),snapping=false,snapRaf=0;
function readScroll(){ if(FORCE!==null)return; target=maxY()>0?scrollY/maxY():0; lastScroll=performance.now(); if(scrollY>40)hint.style.opacity="0"; }
addEventListener("scroll",()=>{readScroll(); if(!snapping)cancelSnap();},{passive:true});
readScroll();

function render(){
  const W=innerWidth;
  rail.style.transform=`translate3d(${(-p*(N-1)*W).toFixed(2)}px,0,0)`;
  secs.forEach((s,i)=>{
    // local progress of this chapter: -1 (off right) … 0 (centered) … 1 (off left)
    const lp=Math.max(-1,Math.min(1,p*(N-1)-i));
    s.style.setProperty("--p",lp.toFixed(4));
  });
  bar.style.setProperty("--p",p.toFixed(4));
  const idx=Math.round(p*(N-1));
  cur.textContent=String(idx+1).padStart(2,"0");
  dotBtns.forEach((b,i)=>{b.classList.toggle("on",i===idx);b.setAttribute("aria-selected",i===idx);});
}
function frame(){
  requestAnimationFrame(frame);
  p+=(target-p)*(REDUCED?1:.09);
  if(Math.abs(target-p)<1e-4)p=target;
  render();
  // soft snap: 160 ms after the last scroll input, glide to the nearest chapter
  if(FORCE===null&&!REDUCED&&!snapping&&performance.now()-lastScroll>160){
    const nearest=Math.round(target*(N-1))/(N-1);
    if(Math.abs(nearest-target)>0.002)snapTo(nearest);
  }
}
function cancelSnap(){snapping=false;cancelAnimationFrame(snapRaf);}
function snapTo(frac,ms=650){
  const from=scrollY,to=frac*maxY(),t0=performance.now();snapping=true;
  const ease=t=>1-Math.pow(1-t,3);
  (function step(){
    const t=Math.min(1,(performance.now()-t0)/ms);
    scrollTo(0,from+(to-from)*ease(t));
    if(t<1&&snapping)snapRaf=requestAnimationFrame(step);else{snapping=false;lastScroll=performance.now();}
  })();
}
function goTo(i){ if(FORCE!==null)return; cancelSnap(); snapTo(i/(N-1),800); }
addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();goTo(Math.min(N-1,Math.round(target*(N-1))+1));}
  if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();goTo(Math.max(0,Math.round(target*(N-1))-1));}
});
addEventListener("resize",render);
if(FORCE!==null){document.getElementById("track").style.height="100vh";document.body.style.overflow="hidden";render();}
else frame();
</script>
</body>
</html>
